spring.application.name=Cohort-The-Platform

###database
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=${DATABASE_DRIVER}
spring.jpa.database-platform=${DATABASE_DIALECT}
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none

###JWT
JWT_SECRET_KEY=${JWT_SECRET_KEY}

###LIQUIBASE
spring.liquibase.change-log=${LIQUIBASE_CHANGELOG}
spring.liquibase.contexts=dev

###SPRING-MAIL
spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.port=${SPRING_MAIL_PORT}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.ssl.checkserveridentity=false
logging.level.org.springframework.mail=DEBUG
logging.level.com.sun.mail=DEBUG
logging.level.org.springframework.security=DEBUG

###AWS-S3
#cloud.aws.credentials.accessKey=AKIAU6GDUPB53VD7
cloud.aws.credentials.secretKey=""
cloud.aws.region.static=""
cloud.aws.s3.bucket=""
spring.servlet.multipart.enabled=true

spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.max-file-size=10MB

ServicePointManager.DefaultConnectionLimit = 25
S3_BUCKETNAME=${AWS_BUCKET_NAME}
cloud.aws.credentials.accessKey=${AWS_ACCESS_KEY}
aws.s3.secretKey=${AWS_SECRET_KEY}